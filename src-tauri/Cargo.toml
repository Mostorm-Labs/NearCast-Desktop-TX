[package]
name = "nearcast_desktop_tx"
version = "0.1.0"
edition = "2021"

[lib]
name = "nearcast_desktop_tx_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
x509-parser = "0.18"
sha2 = "0.10"
httparse = "1"
tempfile = "3"
getrandom = "0.3"
minisign-verify = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
tauri-plugin-updater = "=2.14.1"
base64 = "0.23"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
rcgen = "0.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_UI_Input_Pointer", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11", "Win32_System_Com"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61.3", features = ["Win32_System_Threading"] }
