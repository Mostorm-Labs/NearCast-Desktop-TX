[package]
name = "nearcast_desktop_tx"
version = "0.1.0"
edition = "2021"

[lib]
name = "nearcast_desktop_tx_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "=1.10.0"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
x509-parser = "0.18"
sha2 = "0.10"
httparse = "1"
tempfile = "3"
getrandom = "0.3"
minisign-verify = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
base64 = "0.23"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies.tauri-plugin-updater]
version = "=2.14.1"
default-features = false
features = ["rustls-tls", "system-proxy"]

[target.'cfg(not(windows))'.dependencies.tauri-plugin-updater]
version = "=2.14.1"
default-features = false
# macOS updater installs signed .app.tar.gz archives.
features = ["rustls-tls", "system-proxy", "zip"]

[dev-dependencies]
rcgen = "0.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61.3", features = ["Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
