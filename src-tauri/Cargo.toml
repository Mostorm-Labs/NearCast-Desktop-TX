[package]
name = "nearcast_desktop_tx"
version = "0.1.0"
edition = "2021"

[lib]
name = "nearcast_desktop_tx_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
x509-parser = "0.18"
sha2 = "0.10"
httparse = "1"
tempfile = "3"
getrandom = "0.3"

[dev-dependencies]
rcgen = "0.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_UI_Input_Pointer", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
