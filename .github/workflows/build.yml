name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      display: ${{ steps.counter.outputs.display }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - id: counter
        env:
          RESERVE: ${{ github.event_name != 'pull_request' }}
        run: |
          node --input-type=module <<'JS'
          import {allocateVersion,reserveRemoteVersion} from './scripts/build-version.mjs';
          import {appendFileSync} from 'node:fs';
          const v=await (process.env.RESERVE==='true'?reserveRemoteVersion():allocateVersion());
          appendFileSync(process.env.GITHUB_OUTPUT,'display='+v.display+'\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: tx-build-counter
          path: build-version.json
  test:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-15-intel
            rust-target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            rust-target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      NEARCAST_BUILD_VERSION: ${{ needs.version.outputs.display }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: build-${{ matrix.rust-target }}
      - run: npm ci
      - name: Run JavaScript tests
        run: npm test
      - uses: actions/download-artifact@v4
        with:
          name: tx-build-counter
          path: .
      - name: Check Rust backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust-target }}
      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust-target }}
      - name: Build Tauri bundle
        run: node scripts/build.mjs --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }} -- --locked
        env:
          CI: true
      - name: Name desktop installers
        if: runner.os == 'Windows'
        run: node scripts/name-installers.mjs "src-tauri/target/${{ matrix.rust-target }}/release/bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: nearcast-desktop-tx-${{ matrix.rust-target }}
          path: src-tauri/target/${{ matrix.rust-target }}/release/bundle
