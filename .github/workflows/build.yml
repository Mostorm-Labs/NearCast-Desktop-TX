name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-15-intel
            rust-target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            rust-target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - run: npm ci
      - name: Run JavaScript tests
        run: npm test
      - name: Check Rust backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust-target }}
      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust-target }}
      - name: Build Tauri bundle
        run: node node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }} -- --locked
        env:
          CI: true
      - name: Name desktop installers
        if: runner.os == 'Windows'
        run: node scripts/name-installers.mjs "src-tauri/target/${{ matrix.rust-target }}/release/bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: nearcast-desktop-tx-${{ matrix.rust-target }}
          path: src-tauri/target/${{ matrix.rust-target }}/release/bundle
