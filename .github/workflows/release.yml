name: Release TX
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*', '!v*.*.*.*']
  workflow_dispatch:
    inputs:
      logical_version:
        description: Logical version X.Y.Z
        required: true
      channel:
        description: Mosapi channel
        type: choice
        options: [alpha, beta, release]
        default: alpha
      platforms:
        description: Platforms to build and publish
        type: choice
        options: [windows, all]
        default: windows
concurrency:
  group: tx-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      logical: ${{ steps.version.outputs.logical }}
      build: ${{ steps.version.outputs.build }}
      display: ${{ steps.version.outputs.display }}
      channel: ${{ steps.version.outputs.channel }}
      platforms: ${{ steps.version.outputs.platforms }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.logical_version }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CHANNEL: ${{ inputs.channel || 'release' }}
          PLATFORMS: ${{ inputs.platforms || 'all' }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MOSAPI_TOKEN: ${{ secrets.MOSAPI_TOKEN }}
        run: |
          test -n "$UPDATER_KEY" || { echo "Configure TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          test -n "$MOSAPI_TOKEN" || { echo "Configure MOSAPI_TOKEN"; exit 1; }
          test "$RUN_ATTEMPT" = 1 || { echo "Create a new workflow run to allocate a new Build"; exit 1; }
          node --input-type=module <<'JS'
          import {releaseVersion,releaseMatrix} from './scripts/release.mjs';
          import {appendFileSync} from 'node:fs';
          const v=releaseVersion(process.env.INPUT_VERSION || process.env.REF_NAME.replace(/^v/,''),process.env.BUILD_NUMBER);
          appendFileSync(process.env.GITHUB_OUTPUT,'logical='+v.logical+'\nbuild='+v.build+'\ndisplay='+v.display+'\nchannel='+process.env.CHANNEL+'\n');
          appendFileSync(process.env.GITHUB_OUTPUT,'platforms='+process.env.PLATFORMS+'\nmatrix='+JSON.stringify(releaseMatrix(process.env.PLATFORMS))+'\n');
          JS
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      NEARCAST_BUILD_NUMBER: ${{ needs.version.outputs.build }}
      NEARCAST_LOGICAL_VERSION: ${{ needs.version.outputs.logical }}
      NEARCAST_UPDATE_CHANNEL: ${{ needs.version.outputs.channel }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
          cache-on-failure: true
      - run: node --test tests/*.test.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
        env:
          NEARCAST_UPDATE_CHANNEL: release
      - name: Configure signed release
        run: node scripts/release.mjs config "${{ needs.version.outputs.logical }}" "${{ needs.version.outputs.build }}" "${{ matrix.platform }}"
      - name: Require Apple identity for public releases
        if: matrix.platform == 'macos' && needs.version.outputs.channel == 'release'
        shell: bash
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test "$APPLE_SIGNING_IDENTITY" != "-"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - name: Build update bundles
        run: node node_modules/@tauri-apps/cli/tauri.js build --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Name desktop installers
        if: runner.os == 'Windows'
        run: node scripts/name-installers.mjs "src-tauri/target/${{ matrix.target }}/release/bundle"
      - name: Name and sign update assets
        run: node scripts/release.mjs prepare "${{ matrix.target }}" "${{ matrix.platform }}" "${{ matrix.arch }}" "${{ needs.version.outputs.display }}" "src-tauri/target/${{ matrix.target }}/release/bundle" release
      - uses: actions/upload-artifact@v4
        with:
          name: tx-update-${{ matrix.target }}
          path: release
          if-no-files-found: error
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: tx-update-*
          path: artifacts
          merge-multiple: true
      - name: Generate signed platform manifests
        run: node scripts/release.mjs aggregate "${{ needs.version.outputs.display }}" artifacts release "${{ needs.version.outputs.channel }}" "${{ needs.version.outputs.platforms }}"
      - name: Bundle one-link release resources
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display }}
          PLATFORMS: ${{ needs.version.outputs.platforms }}
        run: |
          cd release
          if [ "$PLATFORMS" = windows ]; then
            zip -r "../NearHub-Cast-$DISPLAY_VERSION-release-assets.zip" windows
          else
            zip -r "../NearHub-Cast-$DISPLAY_VERSION-release-assets.zip" windows macos
          fi
          cd ..
          sha256sum "NearHub-Cast-$DISPLAY_VERSION-release-assets.zip" > "NearHub-Cast-$DISPLAY_VERSION-release-assets.zip.sha256"
      - name: Read release notes
        id: notes
        run: |
          echo 'changelog<<TX_CHANGELOG_EOF' >> "$GITHUB_OUTPUT"
          cat release/changelog.md >> "$GITHUB_OUTPUT"
          echo 'TX_CHANGELOG_EOF' >> "$GITHUB_OUTPUT"
      - name: Create draft GitHub Release
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display }}
        run: |
          if gh release view "v$DISPLAY_VERSION" --json isDraft,assets > release-state.json 2>/dev/null; then
            node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("release-state.json")); if(!r.isDraft || r.assets.length) throw Error("Release already contains published assets; allocate a new Build");'
          else
            gh release create "v$DISPLAY_VERSION" --target "$GITHUB_SHA" --title "NearHub Cast $DISPLAY_VERSION" --draft --generate-notes
          fi
          find release -type f ! -name changelog.md -print0 | xargs -0 gh release upload "v$DISPLAY_VERSION"
          gh release upload "v$DISPLAY_VERSION" "NearHub-Cast-$DISPLAY_VERSION-release-assets.zip" "NearHub-Cast-$DISPLAY_VERSION-release-assets.zip.sha256"
      - name: Upload Windows update to Mosapi
        id: windows
        uses: Mostorm-Labs/mosapi-action@2a454b04db90656e5af273561752f30f7a2d6844 # composite output mapping fixed
        with:
          token: ${{ secrets.MOSAPI_TOKEN }}
          folder-id: '546'
          product-id: '646'
          product-slug: nearcast-tx-windows
          project-name: NearHub Cast
          changelog: ${{ steps.notes.outputs.changelog }}
          version: ${{ needs.version.outputs.display }}
          state: ${{ needs.version.outputs.channel }}
          type: optional
          artifacts: release/windows/*
      - name: Upload macOS update to Mosapi
        id: macos
        if: needs.version.outputs.platforms == 'all'
        uses: Mostorm-Labs/mosapi-action@2a454b04db90656e5af273561752f30f7a2d6844 # composite output mapping fixed
        with:
          token: ${{ secrets.MOSAPI_TOKEN }}
          folder-id: '546'
          product-id: '647'
          product-slug: nearcast-tx-macos
          project-name: NearHub Cast
          changelog: ${{ steps.notes.outputs.changelog }}
          version: ${{ needs.version.outputs.display }}
          state: ${{ needs.version.outputs.channel }}
          type: optional
          artifacts: release/macos/*
      - name: Publish GitHub Release
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          WINDOWS_UPDATE: ${{ steps.windows.outputs.update-id }}
          MACOS_UPDATE: ${{ steps.macos.outputs.update-id }}
          WINDOWS_COUNT: ${{ steps.windows.outputs.uploaded-count }}
          MACOS_COUNT: ${{ steps.macos.outputs.uploaded-count }}
          PLATFORMS: ${{ needs.version.outputs.platforms }}
        run: |
          test -n "$WINDOWS_UPDATE"
          test "$WINDOWS_COUNT" = 9
          if [ "$PLATFORMS" = all ]; then
            test -n "$MACOS_UPDATE"
            test "$MACOS_COUNT" = 9
          fi
          if [ "$CHANNEL" = release ]; then
            gh release edit "v$DISPLAY_VERSION" --draft=false --latest
          else
            gh release edit "v$DISPLAY_VERSION" --draft=false --prerelease
          fi
          echo "Mosapi Windows update: $WINDOWS_UPDATE" >> "$GITHUB_STEP_SUMMARY"
          echo "Mosapi macOS update: $MACOS_UPDATE" >> "$GITHUB_STEP_SUMMARY"
