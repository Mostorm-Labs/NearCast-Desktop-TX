name: Release TX
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*', '!v*.*.*.*']
  workflow_dispatch:
    inputs:
      logical_version:
        description: Logical version X.Y.Z
        required: true
      channel:
        description: Mosapi channel
        type: choice
        options: [alpha, beta, release]
        default: alpha
      platforms:
        description: Platforms to build and publish
        type: choice
        options: [windows, all]
        default: windows
      publish:
        description: Publish to GitHub Release and Mosapi
        type: boolean
        default: true
concurrency:
  group: tx-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      logical: ${{ steps.version.outputs.logical }}
      build: ${{ steps.version.outputs.build }}
      display: ${{ steps.version.outputs.display }}
      channel: ${{ steps.version.outputs.channel }}
      platforms: ${{ steps.version.outputs.platforms }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release source
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Select main when starting Release TX."
            exit 1
          fi
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "The release commit must be on main."
            exit 1
          }
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.logical_version }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CHANNEL: ${{ inputs.channel || 'release' }}
          PLATFORMS: ${{ inputs.platforms || 'all' }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MOSAPI_TOKEN: ${{ secrets.MOSAPI_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY || secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_NOTARIZATION_METHOD: ${{ vars.APPLE_NOTARIZATION_METHOD }}
        run: |
          test -n "$UPDATER_KEY" || { echo "Configure TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          if [ "$PUBLISH" = true ]; then
            test -n "$MOSAPI_TOKEN" || { echo "Configure MOSAPI_TOKEN"; exit 1; }
          fi
          test "$RUN_ATTEMPT" = 1 || { echo "Create a new workflow run to allocate a new Build"; exit 1; }
          if [ "$PLATFORMS" = all ]; then
            node scripts/macos-signing.mjs check
          fi
          node --input-type=module <<'JS'
          import {releaseVersion,releasePlatforms,macosReleaseMatrix} from './scripts/release.mjs';
          import {reserveRemoteVersion} from './scripts/build-version.mjs';
          import {appendFileSync} from 'node:fs';
          releasePlatforms(process.env.PLATFORMS);
          const reserved=await reserveRemoteVersion({logicalVersion:process.env.INPUT_VERSION || process.env.REF_NAME.replace(/^v/,'')});
          const v=releaseVersion(reserved.logicalVersion,reserved.build);
          appendFileSync(process.env.GITHUB_OUTPUT,'logical='+v.logical+'\nbuild='+v.build+'\ndisplay='+v.display+'\nchannel='+process.env.CHANNEL+'\n');
          appendFileSync(process.env.GITHUB_OUTPUT,'platforms='+process.env.PLATFORMS+'\nmatrix='+JSON.stringify(macosReleaseMatrix())+'\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: tx-build-counter
          path: build-version.json
          if-no-files-found: error
  build-windows:
    needs: version
    # Workflow calls use the branch name. The runner group allowlist uses refs/heads/main.
    uses: Mostorm-Labs/NearCast-Desktop-TX/.github/workflows/release-windows.yml@main
    with:
      logical: ${{ needs.version.outputs.logical }}
      build: ${{ needs.version.outputs.build }}
      display: ${{ needs.version.outputs.display }}
      channel: ${{ needs.version.outputs.channel }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  build-macos:
    needs: version
    if: needs.version.outputs.platforms == 'all'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      NEARCAST_BUILD_VERSION: ${{ needs.version.outputs.display }}
      NEARCAST_UPDATE_CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
          cache-on-failure: true
      - run: npm test
      - uses: actions/download-artifact@v4
        with:
          name: tx-build-counter
          path: .
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
        env:
          NEARCAST_UPDATE_CHANNEL: release
      - name: Configure signed release
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY || secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/release.mjs config "${{ needs.version.outputs.logical }}" "${{ needs.version.outputs.build }}" macos
      - name: Build signed app and DMG, verify App and notarize DMG
        env:
          NEARCAST_REQUIRE_MACOS_SIGNING: '1'
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY || secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_NOTARIZATION_METHOD: ${{ vars.APPLE_NOTARIZATION_METHOD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/build.mjs --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles app,dmg -- --locked
          node scripts/macos-signing.mjs verify "src-tauri/target/${{ matrix.target }}/release/bundle/macos/NearHub Cast.app"
          node scripts/release.mjs prepare "${{ matrix.target }}" macos "${{ matrix.arch }}" "$NEARCAST_BUILD_VERSION" "src-tauri/target/${{ matrix.target }}/release/bundle" release
      - uses: actions/upload-artifact@v4
        with:
          name: tx-update-${{ matrix.target }}
          path: release
          if-no-files-found: error
  publish:
    needs: [version, build-windows, build-macos]
    if: >-
      !cancelled() && (github.event_name == 'push' || inputs.publish) &&
      needs.version.result == 'success' && needs.build-windows.result == 'success' &&
      (needs.version.outputs.platforms == 'windows' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: tx-update-*
          path: artifacts
          merge-multiple: true
      - name: Generate signed platform manifests
        run: node scripts/release.mjs aggregate "${{ needs.version.outputs.display }}" artifacts release "${{ needs.version.outputs.channel }}" "${{ needs.version.outputs.platforms }}"
      - name: Bundle one-link release resources
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display }}
          PLATFORMS: ${{ needs.version.outputs.platforms }}
        run: |
          cd release
          if [ "$PLATFORMS" = windows ]; then
            zip -r "../NearHub-Cast-$DISPLAY_VERSION-release-assets.zip" windows
          else
            zip -r "../NearHub-Cast-$DISPLAY_VERSION-release-assets.zip" windows macos
          fi
          cd ..
          sha256sum "NearHub-Cast-$DISPLAY_VERSION-release-assets.zip" > "NearHub-Cast-$DISPLAY_VERSION-release-assets.zip.sha256"
      - name: Read release notes
        id: notes
        run: |
          echo 'changelog<<TX_CHANGELOG_EOF' >> "$GITHUB_OUTPUT"
          cat release/changelog.md >> "$GITHUB_OUTPUT"
          echo 'TX_CHANGELOG_EOF' >> "$GITHUB_OUTPUT"
      - name: Create draft GitHub Release
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display }}
        run: |
          if gh release view "v$DISPLAY_VERSION" --json isDraft,assets > release-state.json 2>/dev/null; then
            node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("release-state.json")); if(!r.isDraft || r.assets.length) throw Error("Release already contains published assets; allocate a new Build");'
          else
            gh release create "v$DISPLAY_VERSION" --target "$GITHUB_SHA" --title "NearHub Cast $DISPLAY_VERSION" --draft --generate-notes
          fi
          find release -type f ! -name changelog.md -print0 | xargs -0 gh release upload "v$DISPLAY_VERSION"
          gh release upload "v$DISPLAY_VERSION" "NearHub-Cast-$DISPLAY_VERSION-release-assets.zip" "NearHub-Cast-$DISPLAY_VERSION-release-assets.zip.sha256"
      - name: Upload Windows update to Mosapi
        id: windows
        uses: Mostorm-Labs/mosapi-action@2a454b04db90656e5af273561752f30f7a2d6844 # composite output mapping fixed
        with:
          token: ${{ secrets.MOSAPI_TOKEN }}
          folder-id: '546'
          product-id: '646'
          product-slug: nearcast-tx-windows
          project-name: NearHub Cast
          changelog: ${{ steps.notes.outputs.changelog }}
          version: ${{ needs.version.outputs.display }}
          state: ${{ needs.version.outputs.channel }}
          type: optional
          artifacts: release/windows/*
      - name: Upload macOS update to Mosapi
        id: macos
        if: needs.version.outputs.platforms == 'all'
        uses: Mostorm-Labs/mosapi-action@2a454b04db90656e5af273561752f30f7a2d6844 # composite output mapping fixed
        with:
          token: ${{ secrets.MOSAPI_TOKEN }}
          folder-id: '546'
          product-id: '647'
          product-slug: nearcast-tx-macos
          project-name: NearHub Cast
          changelog: ${{ steps.notes.outputs.changelog }}
          version: ${{ needs.version.outputs.display }}
          state: ${{ needs.version.outputs.channel }}
          type: optional
          artifacts: release/macos/*
      - name: Publish GitHub Release
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          WINDOWS_UPDATE: ${{ steps.windows.outputs.update-id }}
          MACOS_UPDATE: ${{ steps.macos.outputs.update-id }}
          WINDOWS_COUNT: ${{ steps.windows.outputs.uploaded-count }}
          MACOS_COUNT: ${{ steps.macos.outputs.uploaded-count }}
          PLATFORMS: ${{ needs.version.outputs.platforms }}
        run: |
          test -n "$WINDOWS_UPDATE"
          test "$WINDOWS_COUNT" = 9
          if [ "$PLATFORMS" = all ]; then
            test -n "$MACOS_UPDATE"
            test "$MACOS_COUNT" = 13
          fi
          if [ "$CHANNEL" = release ]; then
            gh release edit "v$DISPLAY_VERSION" --draft=false --latest
          else
            gh release edit "v$DISPLAY_VERSION" --draft=false --prerelease
          fi
          echo "Mosapi Windows update: $WINDOWS_UPDATE" >> "$GITHUB_STEP_SUMMARY"
          echo "Mosapi macOS update: $MACOS_UPDATE" >> "$GITHUB_STEP_SUMMARY"
